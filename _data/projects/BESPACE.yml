- title: 'BEspace: Boosting the exposome space coverage in the aquatic environment by multidimensional integrated analytical platform'
  members: 'Dr. Saer Samanipour (PI) and Dr. Lapo Renai (postdoc)'
  description: 'BEspace is an MSCA funded project focusing on enhancing the detection capabilities of 
    non-targeted analysis and screening of the exposome chemical space in aquatic environments. 
    The project aims to develop and apply advanced computational (i.e., machine learning-based tools) 
    and analytical (i.e., two-dimensional liquid chromatography) strategies to improve the accuracy 
    and quality of detected known and unknown chemicals, ultimately contributing to more realistic 
    and conservative non-targeted environmental monitoring.'

  collaborators: 'UvA, KWR, UniF'
