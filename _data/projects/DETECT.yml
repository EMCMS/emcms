- title: 'from HRMS Detection to Environmental Contamination Trigger'
 
  members: 'Dr. Saer Samanipour (PI), Dr. Lapo Renai (postdoc), Viktoriia Turkina (PhD candidate), Tobias Hulleman (PhD candidate), Xander Becking (PhD candidate)'

  description: 'DETECT focuses on the development of machine learning tools for interpreting 
    non-targeted LC-HRMS data. The project aims to streamline environmental
    chemical analysis and improve exposure assessment through the integration 
    of computational mass spectrometry and predictive modeling.'
  
  collaborators: 'UvA, UQ, KWR, HWL'
  publications:  
                -Machine Learning for Non-Targeted Analysis of Environmental Mass Spectrometry Data
                -Critical Assessment of the Chemical Space Covered by LC–HRMS Non-Targeted Analysis

 